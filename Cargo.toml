[package]
name = "scam-miner"
version = "0.1.0"
edition = "2021"
description = "High-performance miner for Scummy Bank (dn42), Rust rewrite of miner.py"

[[bin]]
name = "scam-miner"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
anyhow = "1"
ctrlc = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "blocking"] }

# Vulkan backend (optional)
wgpu = { version = "30", default-features = false, features = ["std", "vulkan", "wgsl"], optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "0.3", optional = true }

# OpenCL backend (optional)
opencl3 = { version = "0.12", optional = true }

# ROCm HIP backend (optional, hand-rolled FFI)
libloading = { version = "0.9", optional = true }

[features]
default = ["vulkan", "opencl", "hip"]
vulkan = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]
opencl = ["dep:opencl3"]
hip = ["dep:libloading"]

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
